components:
  schemas:
    AirportListResponse:
      type: object
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Airport'
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Maximum number of items requested.
          example: 100
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before this page.
          example: 0
        has_more:
          type: boolean
          description: Whether another page is available.
          example: true
    Airport:
      type: object
      required:
        - airport_code
        - airport_name
        - city
        - country
        - coordinates
        - timezone
      properties:
        airport_code:
          type: string
          pattern: ^[A-Z]{3}$
          description: Stable IATA airport code.
          example: SVO
        airport_name:
          type: string
          description: Localized airport name.
          example: Sheremetyevo
        city:
          type: string
          description: Localized city name.
          example: Moscow
        country:
          type: string
          description: Localized country name.
          example: Russia
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        timezone:
          type: string
          description: Airport time zone.
          example: Europe/Moscow
    AirportRef:
      type: object
      required:
        - airport_code
      properties:
        airport_code:
          type: string
          pattern: ^[A-Z]{3}$
          description: Stable IATA airport code.
          example: AMD
    Coordinates:
      type: object
      required:
        - longitude
        - latitude
      properties:
        longitude:
          type: number
          format: double
          example: 37.4146
        latitude:
          type: number
          format: double
          example: 55.9726
    Price:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Decimal money amount encoded as string.
          pattern: ^\d+\.\d{2}$
          example: '12500.00'
        currency:
          type: string
          description: ISO 4217 currency code. Current project uses RUB.
          enum:
            - RUB
          example: RUB
    RouteListResponse:
      type: object
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RouteOption'
        limit:
          type: integer
          minimum: 1
          maximum: 500
          example: 100
        offset:
          type: integer
          minimum: 0
          example: 0
        has_more:
          type: boolean
          example: false
    RouteOption:
      type: object
      required:
        - booking_class
        - total_duration
        - total_price
        - segments
      properties:
        booking_class:
          type: string
          enum:
            - Economy
            - Comfort
            - Business
          example: Economy
        total_duration:
          type: string
          description: Total route option duration in ISO 8601 duration format, including connection time.
          example: PT6H5M
        total_price:
          $ref: '#/components/schemas/Price'
        segments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RouteSegment'
    RouteSegment:
      type: object
      required:
        - sequence
        - flight_id
        - route_no
        - departure_airport
        - arrival_airport
        - scheduled_departure_at
        - scheduled_arrival_at
        - duration
        - price
      properties:
        sequence:
          type: integer
          minimum: 1
          description: Segment order inside route option.
          example: 1
        flight_id:
          type: integer
          minimum: 1
          description: Stable flight id used later for booking.
          example: 11066
        route_no:
          type: string
          description: Route number. This maps the task's "Flight no" wording to the 2025 schema field.
          example: PG0055
        departure_airport:
          $ref: '#/components/schemas/AirportRef'
        arrival_airport:
          $ref: '#/components/schemas/AirportRef'
        scheduled_departure_at:
          type: string
          format: date-time
          description: Scheduled departure datetime with offset.
          example: '2025-12-01T07:45:00+05:30'
        scheduled_arrival_at:
          type: string
          format: date-time
          description: Scheduled arrival datetime with offset.
          example: '2025-12-01T08:50:00+05:30'
        duration:
          type: string
          description: Segment duration in ISO 8601 duration format.
          example: PT1H5M
        price:
          $ref: '#/components/schemas/Price'
    Booking:
      type: object
      required:
        - book_ref
        - book_date
        - passenger
        - booking_class
        - total_price
        - trips
      properties:
        book_ref:
          type: string
          pattern: ^[A-Z0-9]{6}$
          description: Booking reference generated by backend.
          example: 002MYE
        book_date:
          type: string
          format: date-time
          description: Booking creation time from bookings.book_date.
          example: '2025-10-04T03:55:10+00:00'
        passenger:
          $ref: '#/components/schemas/BookingPassenger'
        booking_class:
          type: string
          enum:
            - Economy
            - Comfort
            - Business
          example: Economy
        total_price:
          $ref: '#/components/schemas/Price'
        trips:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/BookingTrip'
    BookingCreateRequest:
      type: object
      additionalProperties: false
      required:
        - booking_class
        - passenger
        - trips
      properties:
        booking_class:
          type: string
          enum:
            - Economy
            - Comfort
            - Business
          description: Fare condition to use for all selected trips.
          example: Economy
        passenger:
          $ref: '#/components/schemas/BookingPassengerInput'
        trips:
          type: array
          minItems: 1
          maxItems: 2
          description: One outbound trip and optionally one return trip.
          items:
            $ref: '#/components/schemas/BookingCreateTrip'
    BookingCreateTrip:
      type: object
      additionalProperties: false
      required:
        - direction
        - segments
      properties:
        direction:
          type: string
          enum:
            - outbound
            - return
          description: Trip direction. Maps to tickets.outbound.
          example: outbound
        segments:
          type: array
          minItems: 1
          maxItems: 8
          description: Selected flight ids in trip order.
          items:
            $ref: '#/components/schemas/BookingCreateSegment'
    BookingCreateSegment:
      type: object
      additionalProperties: false
      required:
        - flight_id
      properties:
        flight_id:
          type: integer
          minimum: 1
          description: Selected flight id from route search.
          example: 11066
    BookingPassenger:
      type: object
      required:
        - passenger_id
        - passenger_name
      properties:
        passenger_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Passenger document identifier from tickets.passenger_id.
          example: RU 2714075620824
        passenger_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Passenger full name from tickets.passenger_name.
          example: Nadezhda Sergeeva
    BookingPassengerInput:
      type: object
      additionalProperties: false
      required:
        - passenger_id
        - passenger_name
      properties:
        passenger_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Passenger document identifier from tickets.passenger_id.
          example: RU 2714075620824
        passenger_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Passenger full name from tickets.passenger_name.
          example: Nadezhda Sergeeva
    BookingTrip:
      type: object
      required:
        - direction
        - ticket_no
        - total_price
        - segments
      properties:
        direction:
          type: string
          enum:
            - outbound
            - return
          example: outbound
        ticket_no:
          type: string
          pattern: ^\d{13}$
          description: Ticket number generated by backend.
          example: '0005433348362'
        total_price:
          $ref: '#/components/schemas/Price'
        segments:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/BookingSegment'
    BookingSegment:
      type: object
      required:
        - sequence
        - flight_id
        - route_no
        - departure_airport
        - arrival_airport
        - scheduled_departure_at
        - scheduled_arrival_at
        - price
      properties:
        sequence:
          type: integer
          minimum: 1
          description: Segment order inside trip.
          example: 1
        flight_id:
          type: integer
          minimum: 1
          description: Stable flight id.
          example: 11066
        route_no:
          type: string
          description: Route number. This maps the task's "Flight no" wording to the 2025 schema field.
          example: PG0055
        departure_airport:
          $ref: '#/components/schemas/AirportRef'
        arrival_airport:
          $ref: '#/components/schemas/AirportRef'
        scheduled_departure_at:
          type: string
          format: date-time
          description: Scheduled departure datetime with offset.
          example: '2025-12-01T07:45:00+05:30'
        scheduled_arrival_at:
          type: string
          format: date-time
          description: Scheduled arrival datetime with offset.
          example: '2025-12-01T08:50:00+05:30'
        price:
          $ref: '#/components/schemas/Price'
    CheckInRequest:
      type: object
      additionalProperties: false
      required:
        - ticket_no
        - flight_id
        - seats
      properties:
        ticket_no:
          type: string
          pattern: ^\d{13}$
          description: Ticket number.
          example: '0005433261815'
        flight_id:
          type: integer
          minimum: 1
          description: Entry flight id. Must be the first flight in the ticket.
          example: 11051
        seats:
          type: array
          minItems: 1
          maxItems: 8
          description: Seat choices for every flight in the ticket.
          items:
            $ref: '#/components/schemas/CheckInSeatRequest'
    CheckInSeatRequest:
      type: object
      additionalProperties: false
      required:
        - flight_id
        - seat_no
      properties:
        flight_id:
          type: integer
          minimum: 1
          description: Flight id inside the ticket.
          example: 11051
        seat_no:
          type: string
          minLength: 1
          maxLength: 8
          pattern: ^[0-9]{1,3}[A-Z]$
          description: Requested seat number for the flight.
          example: 31J
    CheckInResponse:
      type: object
      required:
        - ticket_no
        - checked_in_at
        - boarding_passes
      properties:
        ticket_no:
          type: string
          pattern: ^\d{13}$
          example: '0005433261815'
        checked_in_at:
          type: string
          format: date-time
          description: Check-in creation time from bookings.now().
          example: '2025-12-01T00:00:00+00:00'
        boarding_passes:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/BoardingPass'
    BoardingPass:
      type: object
      required:
        - ticket_no
        - flight_id
        - route_no
        - seat_no
      properties:
        ticket_no:
          type: string
          pattern: ^\d{13}$
          example: '0005433348362'
        flight_id:
          type: integer
          minimum: 1
          example: 11051
        route_no:
          type: string
          description: Route number. This maps the task's "Flight no" wording to the 2025 schema field.
          example: PG0356
        seat_no:
          type: string
          minLength: 1
          maxLength: 8
          pattern: ^[0-9]{1,3}[A-Z]$
          example: 31J
    BoardingPassListResponse:
      type: object
      required:
        - ticket_no
        - items
      properties:
        ticket_no:
          type: string
          pattern: ^\d{13}$
          example: '0005433348362'
        items:
          type: array
          description: Boarding passes created for this ticket. Empty when the ticket exists but has not been checked in.
          maxItems: 8
          items:
            $ref: '#/components/schemas/BoardingPass'
    SeatMapResponse:
      type: object
      required:
        - ticket_no
        - flight_id
        - items
      properties:
        ticket_no:
          type: string
          pattern: ^\d{13}$
          example: '0005433261815'
        flight_id:
          type: integer
          minimum: 1
          example: 11051
        items:
          type: array
          description: >-
            Full seat map for this flight/ticket context. This is a bounded list limited by aircraft capacity, not a
            paginated directory.
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SeatMapSeat'
    SeatMapSeat:
      type: object
      required:
        - seat_no
        - fare_conditions
        - status
      properties:
        seat_no:
          type: string
          minLength: 1
          maxLength: 8
          pattern: ^[0-9]{1,3}[A-Z]$
          example: 17B
        fare_conditions:
          type: string
          enum:
            - Economy
            - Comfort
            - Business
          example: Economy
        status:
          type: string
          enum:
            - available
            - blocked
            - occupied
          description: Seat status for this ticket segment.
          example: available
    ScheduledArrivalListResponse:
      type: object
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledArrival'
        limit:
          type: integer
          minimum: 1
          maximum: 500
          example: 100
        offset:
          type: integer
          minimum: 0
          example: 0
        has_more:
          type: boolean
          example: false
    ScheduledArrival:
      type: object
      required:
        - route_no
        - days_of_week
        - scheduled_time
        - timezone
        - origin
      properties:
        route_no:
          type: string
          description: Route number. This maps the task's "Flight no" wording to the 2025 schema field.
          example: PG0401
        days_of_week:
          type: array
          description: Arrival weekdays in RFC 5545 weekday token format.
          items:
            $ref: '#/components/schemas/Weekday'
          example:
            - MO
            - WE
            - FR
        scheduled_time:
          type: string
          description: Scheduled arrival time of day in the destination airport timezone.
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '14:35'
        timezone:
          type: string
          description: IANA timezone of the destination airport.
          example: Asia/Kolkata
        origin:
          $ref: '#/components/schemas/AirportRef'
    ScheduledDepartureListResponse:
      type: object
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledDeparture'
        limit:
          type: integer
          minimum: 1
          maximum: 500
          example: 100
        offset:
          type: integer
          minimum: 0
          example: 0
        has_more:
          type: boolean
          example: false
    ScheduledDeparture:
      type: object
      required:
        - route_no
        - days_of_week
        - scheduled_time
        - timezone
        - destination
      properties:
        route_no:
          type: string
          description: Route number. This maps the task's "Flight no" wording to the 2025 schema field.
          example: PG0401
        days_of_week:
          type: array
          description: Departure weekdays in RFC 5545 weekday token format.
          items:
            $ref: '#/components/schemas/Weekday'
          example:
            - MO
            - WE
            - FR
        scheduled_time:
          type: string
          description: Scheduled departure time of day in the origin airport timezone.
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '11:20'
        timezone:
          type: string
          description: IANA timezone of the origin airport.
          example: Asia/Kolkata
        destination:
          $ref: '#/components/schemas/AirportRef'
    Weekday:
      type: string
      description: RFC 5545 weekday token.
      enum:
        - MO
        - TU
        - WE
        - TH
        - FR
        - SA
        - SU
      example: MO
    CityListResponse:
      type: object
      required:
        - items
        - limit
        - offset
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Maximum number of items requested.
          example: 100
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before this page.
          example: 0
        has_more:
          type: boolean
          description: Whether another page is available.
          example: true
    City:
      type: object
      required:
        - city
        - country
      properties:
        city:
          type: string
          description: Localized city name.
          example: Novosibirsk
        country:
          type: string
          description: Localized country name.
          example: Russia
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          example: invalid_scope
        message:
          type: string
          description: Human-readable error message.
          example: 'scope must be one of: all, route_source, route_destination, route_any'

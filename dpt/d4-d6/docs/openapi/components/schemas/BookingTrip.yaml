type: object
required:
  - direction
  - ticket_no
  - total_price
  - segments
properties:
  direction:
    type: string
    enum:
      - outbound
      - return
    example: outbound
  ticket_no:
    type: string
    pattern: "^\\d{13}$"
    description: Ticket number generated by backend.
    example: "0005433348362"
  total_price:
    $ref: ./Price.yaml
  segments:
    type: array
    minItems: 1
    maxItems: 8
    items:
      $ref: ./BookingSegment.yaml

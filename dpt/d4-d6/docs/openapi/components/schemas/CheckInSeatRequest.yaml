type: object
additionalProperties: false
required:
  - flight_id
  - seat_no
properties:
  flight_id:
    type: integer
    minimum: 1
    description: Flight id inside the ticket.
    example: 11051
  seat_no:
    type: string
    minLength: 1
    maxLength: 8
    pattern: "^[0-9]{1,3}[A-Z]$"
    description: Requested seat number for the flight.
    example: 31J

type: object
required:
  - route_no
  - days_of_week
  - scheduled_time
  - timezone
  - destination
properties:
  route_no:
    type: string
    description: Route number. This maps the task's "Flight no" wording to the 2025 schema field.
    example: PG0401
  days_of_week:
    type: array
    description: Departure weekdays in RFC 5545 weekday token format.
    items:
      $ref: ./Weekday.yaml
    example:
      - MO
      - WE
      - FR
  scheduled_time:
    type: string
    description: Scheduled departure time of day in the origin airport timezone.
    pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
    example: "11:20"
  timezone:
    type: string
    description: IANA timezone of the origin airport.
    example: Asia/Kolkata
  destination:
    $ref: ./AirportRef.yaml

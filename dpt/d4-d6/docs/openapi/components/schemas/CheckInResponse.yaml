type: object
required:
  - ticket_no
  - checked_in_at
  - boarding_passes
properties:
  ticket_no:
    type: string
    pattern: "^\\d{13}$"
    example: "0005433261815"
  checked_in_at:
    type: string
    format: date-time
    description: Check-in creation time from bookings.now().
    example: "2025-12-01T00:00:00+00:00"
  boarding_passes:
    type: array
    minItems: 1
    maxItems: 8
    items:
      $ref: ./BoardingPass.yaml

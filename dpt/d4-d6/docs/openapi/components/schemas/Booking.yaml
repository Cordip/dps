type: object
required:
  - book_ref
  - book_date
  - passenger
  - booking_class
  - total_price
  - trips
properties:
  book_ref:
    type: string
    pattern: "^[A-Z0-9]{6}$"
    description: Booking reference generated by backend.
    example: 002MYE
  book_date:
    type: string
    format: date-time
    description: Booking creation time from bookings.book_date.
    example: "2025-10-04T03:55:10+00:00"
  passenger:
    $ref: ./BookingPassenger.yaml
  booking_class:
    type: string
    enum:
      - Economy
      - Comfort
      - Business
    example: Economy
  total_price:
    $ref: ./Price.yaml
  trips:
    type: array
    minItems: 1
    maxItems: 2
    items:
      $ref: ./BookingTrip.yaml

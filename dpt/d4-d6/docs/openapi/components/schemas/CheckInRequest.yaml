type: object
additionalProperties: false
required:
  - ticket_no
  - flight_id
  - seats
properties:
  ticket_no:
    type: string
    pattern: "^\\d{13}$"
    description: Ticket number.
    example: "0005433261815"
  flight_id:
    type: integer
    minimum: 1
    description: Entry flight id. Must be the first flight in the ticket.
    example: 11051
  seats:
    type: array
    minItems: 1
    maxItems: 8
    description: Seat choices for every flight in the ticket.
    items:
      $ref: ./CheckInSeatRequest.yaml

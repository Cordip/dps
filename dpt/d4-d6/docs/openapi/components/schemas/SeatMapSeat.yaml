type: object
required:
  - seat_no
  - fare_conditions
  - status
properties:
  seat_no:
    type: string
    minLength: 1
    maxLength: 8
    pattern: "^[0-9]{1,3}[A-Z]$"
    example: 17B
  fare_conditions:
    type: string
    enum:
      - Economy
      - Comfort
      - Business
    example: Economy
  status:
    type: string
    enum:
      - available
      - blocked
      - occupied
    description: Seat status for this ticket segment.
    example: available

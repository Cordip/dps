post:
  operationId: createBooking
  summary: Create booking for selected trips
  description: |
    Creates one booking for one passenger from selected flight ids.

    Idempotency behavior:
    - first request with a new Idempotency-Key creates the booking;
    - repeat with the same key and the same body returns the same response;
    - repeat with the same key and a different body returns 409 idempotency_key_conflict;
    - repeat while the first request is still processing returns 409 idempotency_key_in_progress.

    When trying another request body in Scalar, also change Idempotency-Key.
  parameters:
    - name: Idempotency-Key
      in: header
      required: true
      description: Technical retry id generated by API client.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        example: scalar-example-booking-11066
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BookingCreateRequest.yaml
        examples:
          oneWay:
            summary: One-way booking
            value:
              booking_class: Economy
              passenger:
                passenger_id: "D6 SCALAR"
                passenger_name: D6 Scalar Example
              trips:
                - direction: outbound
                  segments:
                    - flight_id: 11066
          roundTrip:
            summary: Round-trip booking
            value:
              booking_class: Economy
              passenger:
                passenger_id: "D6 SCALAR"
                passenger_name: D6 Scalar Example
              trips:
                - direction: outbound
                  segments:
                    - flight_id: 11066
                - direction: return
                  segments:
                    - flight_id: 11106
  responses:
    "201":
      description: Booking created.
      headers:
        Location:
          required: true
          description: URL of created booking.
          schema:
            type: string
            example: /api/v1/bookings/ABC123
        Idempotency-Replayed:
          required: false
          description: True when this response is replayed from a previous request with the same Idempotency-Key.
          schema:
            type: string
            enum:
              - "true"
              - "false"
            example: "false"
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Booking.yaml
          examples:
            oneWayCreated:
              value:
                book_ref: ABC123
                book_date: "2025-12-01T00:00:00+00:00"
                passenger:
                  passenger_id: "D6 SCALAR"
                  passenger_name: D6 Scalar Example
                booking_class: Economy
                total_price:
                  amount: "3250.00"
                  currency: RUB
                trips:
                  - direction: outbound
                    ticket_no: "1234567890123"
                    total_price:
                      amount: "3250.00"
                      currency: RUB
                    segments:
                      - sequence: 1
                        flight_id: 11066
                        route_no: PG0055
                        departure_airport:
                          airport_code: AMD
                        arrival_airport:
                          airport_code: BOM
                        scheduled_departure_at: "2025-12-01T07:45:00+05:30"
                        scheduled_arrival_at: "2025-12-01T08:50:00+05:30"
                        price:
                          amount: "3250.00"
                          currency: RUB
    "400":
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            invalidRequest:
              value:
                error: invalid_request
                message: request body contains unknown fields
            missingIdempotencyKey:
              value:
                error: missing_idempotency_key
                message: Idempotency-Key header is required
            invalidIdempotencyKey:
              value:
                error: invalid_idempotency_key
                message: Idempotency-Key must be a string between 1 and 128 characters
            invalidBookingClass:
              value:
                error: invalid_booking_class
                message: "booking_class must be one of: Economy, Comfort, Business"
            invalidPassenger:
              value:
                error: invalid_passenger
                message: passenger_id and passenger_name are required and must fit length limits
            invalidTrips:
              value:
                error: invalid_trips
                message: trips must contain one outbound trip and optionally one return trip
            invalidDirection:
              value:
                error: invalid_direction
                message: "trip direction must be one of: outbound, return"
            invalidSegments:
              value:
                error: invalid_segments
                message: Each trip must contain between 1 and 8 segments
    "404":
      description: One or more selected flights were not found.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            flightNotFound:
              value:
                error: flight_not_found
                message: One or more flights were not found
    "409":
      description: Booking cannot be completed because of current state.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            idempotencyKeyConflict:
              value:
                error: idempotency_key_conflict
                message: Idempotency-Key was already used with a different request body
            idempotencyKeyInProgress:
              value:
                error: idempotency_key_in_progress
                message: Request with this Idempotency-Key is still being processed
            flightNotAvailable:
              value:
                error: flight_not_available
                message: One or more flights are not available for booking
            invalidTripConnection:
              value:
                error: invalid_trip_connection
                message: Trip segments must form a connected path in the provided order
            invalidReturnTrip:
              value:
                error: invalid_return_trip
                message: Return trip must start after outbound and reverse outbound endpoints
            priceNotAvailable:
              value:
                error: price_not_available
                message: Price is not available for one or more selected flights
